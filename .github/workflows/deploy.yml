name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Build do Site
        run: node build.mjs

      - name: Instalar Firebase CLI e Publicar
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install --no-fund --no-audit -g firebase-tools
          firebase deploy --only hosting --project rztweaksbr --token "$FIREBASE_TOKEN"
