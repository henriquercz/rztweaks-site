<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("../assets/fonts/schibsted-grotesk-latin.woff2") format("woff2");
    font-weight: 400 900;
    font-display: block;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0a;
    color: #f4f2ee;
    font-family: "Schibsted Grotesk", sans-serif;
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr auto;
    padding: 56px 64px 48px;
    position: relative;
  }
  .top { display: flex; align-items: center; gap: 16px; grid-column: 1 / -1; }
  .top img { width: 52px; height: 52px; object-fit: cover; }
  .top span { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
  h1 {
    grid-column: 1 / -1;
    align-self: center;
    font-size: 124px;
    font-weight: 800;
    line-height: 0.86;
    letter-spacing: -0.055em;
    margin-top: -12px;
  }
  p {
    grid-column: 1 / -1;
    align-self: end;
    font-size: 26px;
    font-weight: 500;
    color: #b9b4ad;
    letter-spacing: -0.02em;
  }
  p strong { color: #f4f2ee; font-weight: 700; }
  .bar {
    position: absolute;
    right: 0; top: 0;
    width: 22px; height: 100%;
    background: #e11d2a;
  }
</style>
</head>
<body>
  <div class="top">
    <img src="../assets/brand/logo-mark.jpg" alt="">
    <span>RZ Tweaks</span>
  </div>
  <h1>Mais FPS.<br>Menos lag.</h1>
  <p><strong>Otimização de Windows</strong> para quem joga competitivo. Serviços à distância, suporte no Discord.</p>
  <div class="bar"></div>
</body>
</html>
